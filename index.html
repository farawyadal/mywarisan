<style>
:root{--pri:#4F5D2F;--pri-d:#3A4523;--soft:#EEF0E2;--acc:#A0753A;--accsoft:#F3E6D2;--accd:#6B4A1E;--bg:#FAF8F2;--card:#FFFFFF;--tx:#2B2F1E;--tx2:#6B6A5E;--bd:#E3DFD0;--red:#A32D2D;--redsoft:#FCEBEB}
@media(prefers-color-scheme:dark){:root{--pri:#9DB06A;--pri-d:#C9D6A3;--soft:#2A3020;--acc:#D2A56B;--accsoft:#3A2F1E;--accd:#E6C48F;--bg:#171913;--card:#20231A;--tx:#ECEBE0;--tx2:#A5A596;--bd:#33362B;--red:#F09595;--redsoft:#3A1F1F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:0 12px 12px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:12px 14px calc(12px);margin:0 -12px 12px;display:flex;align-items:center;justify-content:space-between;padding-top:calc(12px + env(safe-area-inset-top))}
@media(prefers-color-scheme:dark){header{background:#2A3020;color:#ECEBE0}}
header h1{font-size:17px;font-weight:600;margin:0}
header button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:8px;padding:6px 12px;font-size:13px}
h2{font-size:15px;margin:16px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.muted{color:var(--tx2);font-size:12px}
.big{font-size:28px;font-weight:600;color:var(--pri-d);margin:2px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini{background:var(--soft);border-radius:8px;padding:8px 10px}
.mini b{display:block;font-size:15px;font-weight:600}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.ic{width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.nm{flex:1;min-width:0}.nm p{margin:0;font-weight:600;font-size:14px}.nm span{font-size:12px;color:var(--tx2)}
.amt{font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.items{display:none;border-top:1px solid var(--bd);padding:4px 12px 10px}
.cat.open .items{display:block}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.it:last-of-type{border-bottom:0}
.it .l{flex:1;min-width:0;cursor:pointer}.it .l small{display:block;color:var(--tx2);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--accsoft);color:var(--accd);margin-left:6px}
.tag.red{background:var(--redsoft);color:var(--red)}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
@media(prefers-color-scheme:dark){.btn{color:#171913}}
.btn.o{background:transparent;color:var(--pri-d);border:1px solid var(--bd)}
.btn.red{background:var(--redsoft);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.add{display:block;width:100%;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--tx2);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--pri-d);font-weight:600}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0}
.chk{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.chk:last-child{border:0}
.opt{border:1px solid var(--bd);border-radius:12px;background:var(--card);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt.on{border:2px solid var(--pri);padding:9px 11px}
.opt p{margin:0;font-weight:600;font-size:14px}.opt span{font-size:12px;color:var(--tx2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:16px}
#loader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .25s}
#loader.off{opacity:0;pointer-events:none}
.donut{width:46px;height:46px;border-radius:50%;border:6px solid var(--soft);border-top-color:var(--pri);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--tx2);font-size:11px;line-height:1.7;margin:18px 0 6px}
.paper{background:#fff;color:#222;border:1px solid var(--bd);border-radius:8px;padding:14px;font-size:12px;line-height:1.6}
.paper h1{font-size:16px;margin:0 0 2px;color:#3A4523}.paper h4{margin:10px 0 2px;font-size:13px;color:#3A4523}
.paper .meta{color:#666;margin:0 0 6px}
.paper .pl{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #ccc;padding:3px 0}
.paper .pl small{display:block;color:#666}
.paper .tot{font-weight:600}
.paper .note{color:#666;margin-top:10px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
th{font-size:11px;color:var(--tx2);font-weight:600}
td:last-child,th:last-child{text-align:right}
#printArea{display:none}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;padding:0}
 #printArea .paper{border:0;font-size:12pt;padding:0}
 body{background:#fff;padding:0}
}
</style>

<body>
<div id="loader"><div class="donut"></div><div class="muted">Memuatkan MyWarisan…</div></div>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="printArea"></div>
<script>
var APP={nama:'MyWarisan',ver:'1.1',tarikh:'22 Nov 2026',tahun:2026};
var KEY='mywarisan_v1';
var insToggleFn=null;
var KAT=[
 {id:'hartanah',n:'Hartanah',s:'Rumah, tanah'},
 {id:'kenderaan',n:'Kenderaan',s:'Kereta, motor'},
 {id:'bank',n:'Wang dan bank',s:'Akaun, tunai',nom:1},
 {id:'simpanan',n:'Simpanan',s:'KWSP, TH, ASB',nom:1},
 {id:'takaful',n:'Insurans dan takaful',s:'Manfaat kematian',nom:1},
 {id:'khairat',n:'Khairat kematian',s:'Bantuan, bukan harta',noval:1},
 {id:'lain',n:'Lain-lain',s:'Diecast, elektronik'},
 {id:'piutang',n:'Piutang',s:'Orang berhutang dengan kita'}
];
var GRP={s1:['hartanah','kenderaan','lain'],s2:['bank','simpanan','takaful'],s3:['khairat'],s4:['piutang']};
var GLBL={s1:'Hartanah, kenderaan, lain-lain',s2:'Bank, simpanan, takaful',s3:'Khairat kematian',s4:'Hutang dan piutang'};
var DEF={nama:'',alamat:'',defPenama:true,semak:'',wasiat:'belum',hide:false,harta:[],hutang:[],waris:[],dok:[],lokasi:[],hubungi:[],bajetAbaikan:[],
 faraid:{jantina:'L',pasangan:1,bapa:0,ibu:0,lelaki:0,perempuan:0,wasiat:0},
 jana:{tipe:1,s1:1,s2:1,s3:1,s4:1,amt:0}};
var S=load();
var view='harta',openCat={},deferred=null;
var WS={belum:'Belum disediakan',sedang:'Sedang disediakan',sudah:'Sudah disahkan'};
function pad2(n){return('0'+n).slice(-2)}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function daysSince(iso){return iso?Math.floor((new Date(todayISO()+'T00:00:00')-new Date(iso+'T00:00:00'))/86400000):9999}
function fmtDate(d){return d.toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}
function icInfo(ic){
 var d=String(ic||'').replace(/\D/g,'');if(d.length!==12)return null;
 var yy=+d.slice(0,2),mm=+d.slice(2,4),dd=+d.slice(4,6),now=new Date(),cy=now.getFullYear()%100;
 var y=yy<=cy?2000+yy:1900+yy,dob=new Date(y,mm-1,dd);
 if(dob.getFullYear()!==y||dob.getMonth()!==mm-1||dob.getDate()!==dd)return null;
 var age=now.getFullYear()-y;if(now.getMonth()<mm-1||(now.getMonth()===mm-1&&now.getDate()<dd))age--;
 return{dob:dob,age:age}
}
function maskIc(v){var d=String(v||'').replace(/\D/g,'');return d?'••••••••'+d.slice(-4):''}
function namesBy(role){return S.waris.filter(function(w){return w.pn===role}).map(function(w){return w.nama})}
function defNom(){var u=namesBy('utama'),g=namesBy('ganti');return u.length?{u:u.join(', '),g:g.join(', ')}:null}
function nomRes(h){
 var id=h.penamaId;
 if(id==='none')return null;
 if(id&&id!=='def'){var w=S.waris.filter(function(x){return x.id===id})[0];if(w)return{t:'Penama: '+w.nama,custom:true}}
 if(h.nominee)return{t:'Nominee: '+h.nominee,custom:true};
 var d=S.defPenama?defNom():null;
 return d?{t:'Penama: '+d.u+(d.g?' · Ganti: '+d.g:'')+' (default)',custom:false}:null
}
function hasNom(h){return!!nomRes(h)}
function nomText(h){var r=nomRes(h);return r?r.t:'Penama belum diisi'}
function lokOf(id){return id?S.lokasi.filter(function(l){return l.id===id})[0]:null}
function lokTxt(id,withHint){var l=lokOf(id);return l?(l.nama+(withHint&&l.petunjuk?' (petunjuk: '+l.petunjuk+')':'')):''}
function lokSmall(x){var l=lokOf(x.lokId);return l?'<small>Dokumen: '+esc(l.nama)+'</small>':''}
function lokSelect(v){
 var h='<select id="f_lokId"><option value="">Belum dipilih</option>';
 S.lokasi.forEach(function(l){h+='<option value="'+l.id+'"'+(v===l.id?' selected':'')+'>'+esc(l.nama)+'</option>'});
 return h+'</select>'+(S.lokasi.length?'':'<div class="muted" style="margin-top:6px">Belum ada lokasi. Tambah di tab Lagi, bahagian Lokasi penyimpanan dokumen.</div>')
}
function penSelect(v){
 var d=defNom(),cur=v||'def',h='<select id="f_penamaId"><option value="def"'+(cur==='def'?' selected':'')+'>'+(d?'Ikut default: '+esc(d.u)+(d.g?' · Ganti: '+esc(d.g):''):'Ikut default (belum ada penama, tambah di tab Waris)')+'</option>';
 S.waris.forEach(function(w){h+='<option value="'+w.id+'"'+(cur===w.id?' selected':'')+'>'+esc(w.nama)+(w.hubungan?' ('+esc(w.hubungan)+')':'')+'</option>'});
 return h+'<option value="none"'+(cur==='none'?' selected':'')+'>Tiada penama</option></select><div class="muted" id="penNote" style="margin-top:6px"></div>'
}
function warisUmur(w){var i=icInfo(w.ic);return i?i.age:null}
function thNote(h,k){var r=nomRes(h);return(k.nom&&r&&!r.custom&&namesBy('ganti').length&&/tabung haji|^th$/i.test(h.nama))?'<small>Semak dengan TH: penama mesti waris yang layak</small>':''}

function load(){
 try{var r=JSON.parse(localStorage.getItem(KEY)||'null');
  if(r){var d=JSON.parse(JSON.stringify(DEF));for(var k in r){if(r[k]!==null&&typeof r[k]==='object'&&!Array.isArray(r[k])&&d[k])Object.assign(d[k],r[k]);else d[k]=r[k]}return d}
 }catch(e){}
 return JSON.parse(JSON.stringify(DEF));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function rm(n){return 'RM '+(Math.round(n*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){return S.hide?'RM ••••':rm(n)}
function katOf(id){return KAT.filter(function(k){return k.id===id})[0]}
function HA(){return S.harta.filter(function(x){return !x.arsip})}
function HU(){return S.hutang.filter(function(x){return !x.arsip})}
function sumKat(id){return HA().filter(function(h){return h.kat===id}).reduce(function(a,h){return a+num(h.jumlah)},0)}
function covInfo(h){
 var tk=h.takId?HA().filter(function(x){return x.id===h.takId})[0]:null;
 if(!tk)return{cov:0,baki:num(h.jumlah),nm:'',full:false,on:false};
 var j=num(h.jumlah),c=h.lindung==='sebahagian'?Math.min(j,Math.max(0,num(h.lindungAmt))):j;
 return{cov:c,baki:j-c,nm:tk.nama,full:c>=j&&j>0,on:true}
}
function covText(h){
 var c=covInfo(h);if(!c.on)return'';
 return c.baki>0?'Dilindungi takaful '+rm(c.cov)+' ('+c.nm+'). Baki '+rm(c.baki)+' belum dilindungi':'Diselesaikan takaful ('+c.nm+')'
}
function takSelect(v){
 var tk=HA().filter(function(x){return x.kat==='takaful'});
 var h='<select id="f_takId"><option value="">Tiada perlindungan</option>';
 tk.forEach(function(x){h+='<option value="'+x.id+'"'+(v===x.id?' selected':'')+'>'+esc(x.nama)+'</option>'});
 return h+'</select><div class="muted" style="margin-top:6px">'+(tk.length?'Pilih takaful yang dah dimasukkan di kategori Takaful. Jumlah MRTA tak perlu dimasukkan sebagai harta kerana dibayar terus kepada bank.':'Belum ada takaful. Tambah dahulu di kategori Takaful (isi jumlah 0 untuk MRTA), kemudian pilih di sini.')+'</div>'
}
function totals(){
 var tot=0;KAT.forEach(function(k){if(!k.noval)tot+=sumKat(k.id)});
 var g=HU().reduce(function(a,h){return a+num(h.jumlah)},0);
 var c=HU().reduce(function(a,h){return a+covInfo(h).cov},0);
 var d=g-c;
 return{tot:tot,debt:d,gross:g,cov:c,net:tot-d}
}

function faraidKira(o,estate){
 var L=Math.max(0,parseInt(o.lelaki)||0),P=Math.max(0,parseInt(o.perempuan)||0),ch=L+P>0;
 var sp=0,spLabel='',spCount=0;
 if(o.jantina==='L'){spCount=Math.max(0,Math.min(4,parseInt(o.pasangan)||0));if(spCount>0){sp=ch?1/8:1/4;spLabel='Isteri'}}
 else{spCount=Math.min(1,parseInt(o.pasangan)||0);if(spCount>0){sp=ch?1/4:1/2;spLabel='Suami'}}
 var ibu=0;if(o.ibu){ibu=ch?1/6:((o.bapa&&sp>0)?(1-sp)/3:1/3)}
 var bapa=o.bapa?1:0,bapaFix=(bapa&&ch)?1/6:0;
 var dau=0;if(L===0&&P>0)dau=P===1?1/2:2/3;
 var fixed=sp+ibu+bapaFix+dau,scale=1,res=0,awl=false;
 if(fixed>1+1e-9){scale=1/fixed;awl=true}else res=Math.max(0,1-fixed);
 var g={sp:sp*scale,ibu:ibu*scale,bapa:bapaFix*scale,dau:dau*scale},sonT=0,dauMix=0,baitul=0;
 if(res>1e-9){
  if(L>0){var parts=2*L+P;sonT=res*2*L/parts;dauMix=res*P/parts}
  else if(bapa){g.bapa+=res}
  else{var base=g.ibu+g.dau;if(base>0){g.ibu+=res*g.ibu/base;g.dau+=res*g.dau/base}else baitul=res}
 }
 var rows=[];
 function add(label,count,total){if(count>0&&total>1e-12)rows.push({label:label,count:count,pct:total*100,rm:total*estate,per:total*estate/count})}
 add(spLabel,spCount,g.sp);add('Ibu',o.ibu?1:0,g.ibu);add('Bapa',bapa,g.bapa);
 if(L>0){add('Anak lelaki',L,sonT);add('Anak perempuan',P,dauMix)}else add('Anak perempuan',P,g.dau);
 return{rows:rows,awl:awl,baitul:baitul*estate,baitulPct:baitul*100,none:rows.length===0&&baitul===0}
}

function wasiatInfo(){
 var t=totals(),net=Math.max(0,t.net),maks=net/3,w=Math.min(Math.max(0,num(S.faraid.wasiat)),maks);
 return{net:net,maks:maks,w:w,baki:net-w}
}

function model(type,o){
 var t=totals(),secs=[],totl=[],notes=[];
 var title=type===1?'Panduan Waris':type===2?'Penyata Harta':'Draf Rujukan Wasiat dan Faraid';
 var showAmt=type===1?!!o.amt:true;
 ['s1','s2','s3','s4'].forEach(function(s){
  if(!o[s])return;
  GRP[s].forEach(function(kid){
   var k=katOf(kid),it=HA().filter(function(h){return h.kat===kid});
   if(!it.length)return;
   secs.push({h:k.n,rows:it.map(function(h){
    var sub=[];if(h.kat==='kenderaan'){var il=insLine(h);if(il)sub.push('Insurans: '+il+(h.insTamat?', tamat '+fmtDate(new Date(h.insTamat+'T00:00:00')):''));if(h.jalanTamat)sub.push('Cukai jalan tamat '+fmtDate(new Date(h.jalanTamat+'T00:00:00')))}if(k.nom||h.nominee)sub.push(nomText(h));if(lokOf(h.lokId))sub.push('Dokumen: '+lokTxt(h.lokId,true));if(h.nota)sub.push(h.nota);
    return{a:h.nama,b:showAmt?(k.noval?(num(h.jumlah)>0?'Anggaran '+rm(num(h.jumlah)):''):rm(num(h.jumlah))):'',sub:sub.join(' · ')}
   })})
  });
  if(s==='s4'&&HU().length)secs.push({h:'Hutang',rows:HU().map(function(h){return{a:h.nama,b:showAmt?rm(num(h.jumlah)):'',sub:[covText(h),h.nota].filter(Boolean).join(' · ')}})})
 });
 if(showAmt){totl.push(['Jumlah harta',rm(t.tot)]);totl.push(['Hutang (selepas takaful)',rm(t.debt)]);if(t.cov)totl.push(['Hutang ditanggung takaful',rm(t.cov)]);totl.push(['Harta bersih (anggaran)',rm(t.net)])}
 if(type!==2){
  if(S.waris.length)secs.push({h:'Waris, penama dan wasi',rows:S.waris.map(function(w){var x=[],u=warisUmur(w);if(w.pn==='utama')x.push('Penama');if(w.pn==='ganti')x.push('Penama ganti');if(w.wasi)x.push('Wasi');if(u!==null&&u<18)x.push('Umur '+u);if(w.tel)x.push(w.tel);return{a:w.nama,b:w.hubungan||'',sub:x.join(' · ')}})});
 }
 if(type===1){
  if(S.dok.length)secs.push({h:'Dokumen penting',rows:S.dok.map(function(d){return{a:d.nama,b:'',sub:[lokTxt(d.lokId,true),d.lokasi].filter(Boolean).join(' · ')}})});

function bjKira(d){
 var sen=function(x){return Math.round((Number(x)||0)*100)};
 var kunci=Object.keys(d.sheets||{});
 return (d.hutang||[]).filter(function(h){return h&&h.id}).map(function(h){
  var bayar=0;
  kunci.forEach(function(k){((d.sheets[k]||{}).items||[]).forEach(function(i){
   var a=i.hutang===h.id?sen(i.amount):(i.pecahan&&i.pecahan[h.id]?sen(i.pecahan[h.id]):0);
   if(a>0&&(h.arah==='keluar'?!!i.paid:true))bayar+=a
  })});
  return{bid:h.id,arah:h.arah==='keluar'?'keluar':'masuk',nama:String(h.nama||'Tanpa nama').trim().slice(0,60),baki:Math.max(0,sen(h.jumlah)-bayar)/100}
 })
}

function doImport(file){
 var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.harta))throw 0;if(!confirm('Ganti semua data sekarang dengan fail sandaran ini?'))return;S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);save();render();alert('Data dipulihkan')}catch(e){alert('Fail sandaran tidak sah')}};
 r.readAsText(file)
}
function refreshInstall(){
 var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
 var hb=document.getElementById('hdrInst');if(hb)hb.style.display=(deferred&&!standalone)?'':'none';
 var t=document.getElementById('instTxt');
 if(t&&standalone)t.textContent='App sudah dipasang pada peranti ini.'
}
function doInstall(){
 if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null;refreshInstall()});return}
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 alert(ios?'Di iPhone/iPad: tekan butang Kongsi (Share), kemudian pilih "Add to Home Screen".':'Buka menu pelayar (tiga titik), kemudian pilih "Install app" atau "Add to Home screen".')
}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var a=el.dataset.act;
 if(a==='nav'){view=el.dataset.v;render();window.scrollTo(0,0)}
 else if(a==='cat'){var id=el.dataset.id;openCat[id]=!openCat[id];el.parentNode.classList.toggle('open',!!openCat[id])}
 else if(a==='add')openForm(el.dataset.t,null,el.dataset.k)
 else if(a==='edit')openForm(el.dataset.t,el.dataset.id)
 else if(a==='close')closeSheet()
 else if(a==='saveForm')saveForm()
 else if(a==='del')delItem()
 else if(a==='insToggle'){if(insToggleFn)insToggleFn()}
 else if(a==='arkib')arkibForm()
 else if(a==='tarik')tarik()
 else if(a==='tarikOk')tarikOk()
 else if(a==='tarikIgn'){BJ.st.showIgn=true;tarikRender()}
 else if(a==='arkibOk')arkibOk()
 else if(a==='pulihCur'){pulih(cur.type,cur.id);closeSheet();render()}
 else if(a==='pulih'){pulih(el.dataset.t,el.dataset.id);render()}
 else if(a==='toggleHide'){S.hide=!S.hide;save();render()}
 else if(a==='semakDone'){S.semak=addDays(todayISO(),365);save();render()}
 else if(a==='icEye'){var ie=document.getElementById('f_ic'),hid=ie.style.getPropertyValue('-webkit-text-security')!=='none';ie.style.setProperty('-webkit-text-security',hid?'none':'disc');el.textContent=hid?'Sorok':'Tunjuk'}
 else if(a==='fillFaraid'){
  var c={'Isteri':0,'Suami':0,'Anak lelaki':0,'Anak perempuan':0,'Bapa':0,'Ibu':0};
  S.waris.forEach(function(w){if(c[w.hubungan]!==undefined)c[w.hubungan]++});
  var F2=S.faraid;F2.jantina=(c['Suami']>0&&c['Isteri']===0)?'P':'L';
  F2.pasangan=F2.jantina==='L'?c['Isteri']:Math.min(1,c['Suami']);
  F2.lelaki=c['Anak lelaki'];F2.perempuan=c['Anak perempuan'];F2.bapa=c['Bapa']>0?1:0;F2.ibu=c['Ibu']>0?1:0;
  save();render()
 }
 else if(a==='tipe'){S.jana.tipe=parseInt(el.dataset.n);if(S.jana.tipe===1)S.jana.amt=0;save();render()}
 else if(a==='pdf')buildAndPrint()
 else if(a==='wa')shareWa()
 else if(a==='export')doExport()
 else if(a==='import')document.getElementById('impFile').click()
 else if(a==='wipe'){if(confirm('Padam SEMUA data? Tindakan ini tidak boleh diundur.')&&confirm('Pasti? Buat sandaran dahulu jika perlu.')){S=JSON.parse(JSON.stringify(DEF));save();render()}}
 else if(a==='install')doInstall()
});
document.getElementById('sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.dataset&&t.dataset.jk){S.jana[t.dataset.jk]=t.checked?1:0;save();updPreview()}
 else if(t.id==='impFile'&&t.files[0]){doImport(t.files[0]);t.value=''}
 else if(t.id==='defPenama'){S.defPenama=t.checked;save()}
 else if(t.id==='semakTgl'){if(t.value){S.semak=t.value;save()}}
 else if(t.id==='wasiat'){S.wasiat=t.value;save()}
 else if(t.id==='fa_jantina'){S.faraid.jantina=t.value;if(t.value==='P'&&S.faraid.pasangan>1)S.faraid.pasangan=1;save();render()}
});
document.addEventListener('input',function(e){
 var t=e.target,F=S.faraid;
 if(t.id==='nama'){S.nama=t.value;save()}
 else if(t.id==='alamat'){S.alamat=t.value;save()}
 else if(t.id&&t.id.indexOf('fa_')===0){
  var k=t.id.slice(3);
  if(k==='bapa'||k==='ibu')F[k]=t.checked?1:0;
  else if(k==='wasiat')F[k]=num(t.value);
  else F[k]=Math.max(0,parseInt(t.value)||0);
  save();var o=document.getElementById('faraidOut');if(o)o.innerHTML=faraidOut()
 }
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;refreshInstall()});
window.addEventListener('appinstalled',function(){deferred=null;refreshInstall()});
if(!S.semak)S.semak=addDays(todayISO(),365);
S.harta.forEach(function(h){if(!h.kemaskini)h.kemaskini=todayISO()});
save();
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
setTimeout(function(){setLoader(false)},500);
</script>
</body>
</html>
